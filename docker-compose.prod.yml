services:
  app:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    depends_on:
      - db
      - redis
    networks:
      - fixbook

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - fixbook

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-fixbook}
      POSTGRES_USER: ${DB_USERNAME:-fixbook}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - fixbook

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - fixbook

  queue:
    build:
      context: ./backend
      target: production
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    restart: unless-stopped
    depends_on:
      - db
      - redis
    networks:
      - fixbook

volumes:
  pgdata:

networks:
  fixbook:
    driver: bridge
